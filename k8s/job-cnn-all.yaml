# job-cnn-all.yaml
#
# All CNN baselines in one job:
#   DenseNet-161, ResNet-152, DenseNet201+SwinT,
#   EfficientNet-B2, EfficientNet-B4, FocalConvNet
#
# Change SEEDS to add more seeds: SEEDS="42 0 1"
# Estimated time per seed (1 GPU): ~60-80 h (6 models × 2 folds)
#
# Submit: kubectl apply -f k8s/job-cnn-all.yaml -n <NAMESPACE>

apiVersion: batch/v1
kind: Job
metadata:
  name: vce-cnn-all
  namespace: <NAMESPACE>
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - Tesla-V100-SXM2-32GB
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: runner
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_NO_CACHE_DIR
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: TMPDIR
              value: /pvc/.tmp
            - name: HOME
              value: /pvc/.home
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: github-pat
                  key: token
                  optional: true
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              mkdir -p /pvc/.tmp /pvc/.home /workspace

              apt-get update -qq && apt-get install -y -q git

              if [ -n "${GITHUB_PAT:-}" ]; then
                CLONE_URL=$(echo "https://github.com/amit502/vce-triage.git" | sed "s|https://|https://${GITHUB_PAT}@|")
              else
                CLONE_URL="https://github.com/amit502/vce-triage.git"
              fi
              git clone --branch main --depth 1 "$CLONE_URL" /workspace/vce-triage
              git clone --depth 1 https://github.com/NoviceMAn-prog/FocalConvNet /workspace/FocalConvNet

              pip install -q -r /workspace/vce-triage/requirements.txt

              TRAIN="python /workspace/vce-triage/training/train.py
                --dataset kvasir
                --data-root /pvc/kvasir-capsule
                --output-dir /pvc/results
                --split-mode official
                --patience 20"

              # ── change to run additional seeds ────────────────────────────
              SEEDS="1"

              for SEED in $SEEDS; do
                for FOLD in 0 1; do

                  echo "=== DenseNet-161  fold=${FOLD}  seed=${SEED} ==="
                  $TRAIN --model densenet161 --split-id $FOLD --seed $SEED \
                    --experiment densenet161_kvasir_official_f${FOLD}_seed${SEED}

                  echo "=== ResNet-152  fold=${FOLD}  seed=${SEED} ==="
                  $TRAIN --model resnet152 --split-id $FOLD --seed $SEED \
                    --experiment resnet152_kvasir_official_f${FOLD}_seed${SEED}

                  echo "=== DenseNet201+SwinT  fold=${FOLD}  seed=${SEED} ==="
                  $TRAIN --model densenet201_swint --split-id $FOLD --seed $SEED \
                    --experiment densenet201_swint_kvasir_official_f${FOLD}_seed${SEED}

                  echo "=== EfficientNet-B2  fold=${FOLD}  seed=${SEED} ==="
                  $TRAIN --model efficientnet_b2 --split-id $FOLD --seed $SEED \
                    --experiment efficientnet_b2_kvasir_official_f${FOLD}_seed${SEED}

                  echo "=== EfficientNet-B4  fold=${FOLD}  seed=${SEED} ==="
                  $TRAIN --model efficientnet_b4 --split-id $FOLD --seed $SEED \
                    --experiment efficientnet_b4_kvasir_official_f${FOLD}_seed${SEED}

                  echo "=== FocalConvNet  fold=${FOLD}  seed=${SEED} ==="
                  $TRAIN --model focalconvnet --split-id $FOLD --seed $SEED \
                    --focalconvnet-dir /workspace/FocalConvNet \
                    --experiment focalconvnet_kvasir_official_f${FOLD}_seed${SEED}

                done
              done

          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /pvc
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: <COMPUTE_PVC>
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
