# job-galar-patho-collect.yaml
#
# Collect val+test logits (fp32) for the GALAR pathology (12-class rare-disease)
# focal checkpoints, so the OT decoder runs forward-free. FULL val + FULL test
# (--galar-eval-frac 1.0): the rarest classes (IBD 14, foreign body 60) must keep
# every frame or they vanish from the test set (a 0.1 subsample left nan AUCs).
# Exact true skew -> correct OT prior. 6 runs (2 folds x 3 seeds). V100 (locked).
#
# Submit: kubectl apply -f k8s/job-galar-patho-collect.yaml -n <NAMESPACE>
apiVersion: batch/v1
kind: Job
metadata:
  name: vce-galar-patho-collect
  namespace: <NAMESPACE>
spec:
  completions: 6
  parallelism: 3
  completionMode: Indexed
  backoffLimit: 12
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: ["Tesla-V100-SXM2-32GB"]
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["v100-cc-star-01.noc.ucsb.edu"]
      tolerations:
        - { key: "nvidia.com/gpu", operator: "Exists", effect: "NoSchedule" }
      containers:
        - name: runner
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
          env:
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: PIP_NO_CACHE_DIR, value: "1" }
            - { name: TMPDIR, value: /pvc/.tmp }
            - { name: HOME, value: /pvc/.home }
            - name: GITHUB_PAT
              valueFrom:
                { secretKeyRef: { name: github-pat, key: token, optional: true } }
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              mkdir -p /pvc/.tmp /pvc/.home /workspace
              apt-get update -qq && apt-get install -y -q git
              if [ -n "${GITHUB_PAT:-}" ]; then
                URL=$(echo "https://github.com/amit502/vce-triage.git" | sed "s|https://|https://${GITHUB_PAT}@|")
              else URL="https://github.com/amit502/vce-triage.git"; fi
              git clone --branch main --depth 1 "$URL" /workspace/vce-triage
              pip install -q -r /workspace/vce-triage/requirements.txt
              cd /workspace/vce-triage

              CONFIGS=( "0 0" "0 1" "0 42" "1 0" "1 1" "1 42" )
              read FOLD SEED <<< "${CONFIGS[${JOB_COMPLETION_INDEX}]}"
              CKPT="/pvc/results/checkpoints/densenet201_swint_galar_pathology_focal_official_f${FOLD}_seed${SEED}_best.pt"
              echo "=== collect galar pathology fold=${FOLD} seed=${SEED} ==="
              test -f "$CKPT" || { echo "MISSING $CKPT"; exit 1; }
              python analysis/collect_logits.py \
                --model densenet201_swint --dataset galar --galar-task pathology \
                --checkpoint "$CKPT" \
                --data-root /galar/galar --galar-index /pvc/results/galar_tar_index.pkl \
                --galar-splits-dir /pvc/results/galar_pathology_splits \
                --output-dir /pvc/results \
                --split-id ${FOLD} --seed ${SEED} \
                --batch-size 64 --workers 6 --galar-eval-frac 1.0 \
                --exp densenet201_swint_galar_pathology_focal
          resources:
            # FULL val+test. shmem stays bounded (collect copies+frees each batch;
            # 6 workers x small batch). No disk spill. Rest is reclaimable page-cache.
            requests: { cpu: "6", memory: "24Gi", nvidia.com/gpu: "1" }
            limits:   { cpu: "7", memory: "28Gi", nvidia.com/gpu: "1" }   # <=1.2x request
          volumeMounts:
            - { name: galar, mountPath: /galar, readOnly: true }
            - { name: out,   mountPath: /pvc }
            - { name: shm,   mountPath: /dev/shm }
      volumes:
        - name: galar
          persistentVolumeClaim: { claimName: <GALAR_DATA_PVC> }
        - name: out
          persistentVolumeClaim: { claimName: <COMPUTE_PVC> }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 10Gi }
